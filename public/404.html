<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Miguel Lozano</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
        :root {
            --gradient: linear-gradient(131deg, #7e3f95 30%, #00aeef 130%);
        }
        * {
            box-sizing: border-box;
            margin: 0;
        }
        html, body {
            height: 100%;
        }
        body {
            background: var(--gradient);
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            text-align: center;
            max-width: 640px;
        }
        .bitmoji {
            width: clamp(200px, 32vw, 280px);
            height: auto;
            margin: 0 auto 1.5rem;
            display: block;
            filter: drop-shadow(8px 12px 16px rgba(20, 20, 20, 0.4));
        }
        .code {
            font-size: clamp(80px, 18vw, 160px);
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: -0.05em;
            margin-bottom: 0.6rem;
        }
        .headline {
            font-size: clamp(22px, 5.2vw, 36px);
            font-weight: 500;
            line-height: 1.2;
            letter-spacing: -0.01em;
            white-space: nowrap;
            opacity: 0.95;
            margin-bottom: 1rem;
        }
        .lede {
            font-size: clamp(17px, 2.4vw, 20px);
            font-weight: 400;
            line-height: 1.5;
            opacity: 0.85;
            margin-bottom: 2.2rem;
        }
        .home-link {
            display: inline-block;
            color: #fff;
            background: rgba(217, 217, 217, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 0.4em;
            padding: 14px 32px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.4px;
            transition: background 0.25s ease, border-color 0.25s ease;
        }
        .home-link:hover {
            background: rgba(217, 217, 217, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="bitmoji" src="/bitmoji-punch-through.png" alt="" />
        <div class="code">404</div>
        <div class="headline">Well, this is awkward.</div>
        <div class="lede">The page you're looking for either moved, never existed, or just wanted a moment alone.</div>
        <a class="home-link" href="/">← Back to home</a>
    </div>
</body>
</html>
